<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Акция Family Market</title>
<style>
:root{--bg:#F4F6FA;--surface:#FFF;--surface2:#EEF2F8;--ink:#141A24;--muted:#68748A;--line:#E1E7F0;
--accent:#1F5FA8;--good:#12813C;--shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);}
@media (prefers-color-scheme:dark){:root{--bg:#0D131C;--surface:#161F2B;--surface2:#1D2735;--ink:#E9EDF4;
--muted:#94A1B5;--line:#26313F;--accent:#5FA0E6;--good:#49D17F;--shadow:0 2px 18px rgba(0,0,0,.4);}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 14px calc(46px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:9;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 3px}
.sub{font-size:12.5px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.tab{padding:11px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);
color:var(--muted);font-size:13.5px;font-weight:650;text-align:center;cursor:pointer;user-select:none}
.tab.on{border-color:var(--accent);color:#fff;background:var(--accent)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;
margin-top:14px;box-shadow:var(--shadow);text-align:center}
.hero .lbl{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.hero .big{font-size:40px;font-weight:800;color:var(--good);margin:6px 0 2px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .note{font-size:12.5px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--surface2);margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center;box-shadow:var(--shadow)}
.k .l{font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px}
.k .v{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.nm{font-size:14.5px;font-weight:650;line-height:1.32}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 10px;font-size:11px;color:var(--muted)}
.art{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);padding:2px 7px;border-radius:6px;color:var(--ink)}
.clr{background:var(--surface2);padding:2px 8px;border-radius:6px;text-transform:capitalize}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}
.g div{background:var(--surface2);border-radius:10px;padding:7px 3px}
.g .l{font-size:10px;color:var(--muted);display:block}
.g .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.g .b{color:var(--good)}
.sz{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.sz b{font-weight:650;background:var(--surface2);border-radius:7px;padding:3px 8px;font-size:11.5px;
font-variant-numeric:tabular-nums}
.sz b i{font-style:normal;color:var(--muted);font-weight:600}
.sz .none{color:var(--muted);font-size:11.5px}
.rules{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 15px;margin-top:18px;font-size:13px;line-height:1.6}
.rules b{color:var(--accent)}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:34px 18px;font-size:14px;line-height:1.55}
</style></head><body>
<div class="wrap">
  <header>
    <h1>&#127919; Акция для коллектива</h1>
    <div class="sub" id="per">загрузка…</div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div id="app"></div>
  <div class="rules" id="rules"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
var D=null,CUR=null;
function nf(n){return Number(n||0).toLocaleString('ru-RU')}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function sizes(r){
  if(!r.z||!r.z.length){return r.o?'':'<div class="sz"><span class="none">в магазине закончился</span></div>'}
  var h='<div class="sz">';
  for(var i=0;i<r.z.length;i++){h+='<b>'+esc(r.z[i][0])+' <i>'+nf(r.z[i][1])+'</i></b>'}
  return h+'</div>';
}
function draw(){
  var s=D.stores[CUR]||{rows:[],stock:0,sold:0,rev:0,bonus:0,potential:0};
  var pct=s.potential?Math.min(100,Math.round(s.bonus/s.potential*100)):0;
  var h='<div class="hero">'
   +'<div class="lbl">заработал коллектив</div>'
   +'<div class="big">'+nf(s.bonus)+' &#8376;</div>'
   +'<div class="note">'+(D.started?'из '+nf(s.potential)+' &#8376; — если продать весь остаток':'старт '+D.start+' · можно заработать до '+nf(s.potential)+' &#8376;')+'</div>'
   +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
   +'<div class="note">'+pct+'% от возможного</div></div>'
   +'<div class="kpis">'
   +'<div class="k"><span class="l">продано, шт</span><span class="v">'+nf(s.sold)+'</span></div>'
   +'<div class="k"><span class="l">на сумму</span><span class="v">'+nf(s.rev)+'</span></div>'
   +'<div class="k"><span class="l">осталось, шт</span><span class="v">'+nf(s.stock)+'</span></div>'
   +'</div>';
  h+='<div class="sec">Что предлагаем — '+s.rows.length+' позиций</div>';
  if(!s.rows.length){h+='<div class="empty">В этом магазине акционных позиций нет.</div>'}
  for(var i=0;i<s.rows.length;i++){var r=s.rows[i];
    h+='<div class="card"><div class="nm">'+esc(r.n)+'</div>'
      +'<div class="meta"><span class="art">'+esc(r.a)+'</span>'+(r.c?'<span class="clr">'+esc(r.c)+'</span>':'')+'</div>'
      +'<div class="g">'
      +'<div><span class="l">остаток</span><span class="v">'+nf(r.o)+'</span></div>'
      +'<div><span class="l">продано</span><span class="v">'+nf(r.s)+'</span></div>'
      +'<div><span class="l">премия &#8376;</span><span class="v b">'+nf(r.b)+'</span></div>'
      +'</div>'+sizes(r)+'</div>';
  }
  document.getElementById('app').innerHTML=h;
}
function tabs(){
  var names=Object.keys(D.stores),h='';
  for(var i=0;i<names.length;i++){h+='<div class="tab'+(names[i]===CUR?' on':'')+'" data-s="'+esc(names[i])+'">'+esc(names[i])+'</div>'}
  var t=document.getElementById('tabs');t.innerHTML=h;
  var els=t.getElementsByClassName('tab');
  for(var j=0;j<els.length;j++){els[j].onclick=function(){CUR=this.getAttribute('data-s');
    try{localStorage.setItem('fm_promo_store',CUR)}catch(e){}
    tabs();draw();window.scrollTo(0,0)}}
}
fetch('promo.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){
  D=j;
  try{CUR=localStorage.getItem('fm_promo_store')}catch(e){}
  if(!CUR||!D.stores[CUR])CUR=Object.keys(D.stores)[0];
  document.getElementById('per').textContent=D.start+' — '+D.end+(D.started?' · осталось дней: '+D.days_left:' · ещё не началась');
  document.getElementById('rules').innerHTML=
    '<b>Как это работает.</b> Магазин получает <b>'+D.bonus_pct+'% от суммы продаж</b> акционных позиций своей точки. '
   +'Деньги делятся <b>поровну между всеми сотрудниками магазина</b> — неважно, кто именно пробил чек и в каком ты отделе. '
   +'Предлагай эти товары каждому покупателю: чем больше продали вместе, тем больше получил каждый.';
  document.getElementById('foot').textContent='обновлено '+D.gen+' · данные из 1С';
  tabs();draw();
}).catch(function(e){document.getElementById('app').innerHTML='<div class="empty">Не удалось загрузить данные.<br>Обновите страницу.</div>'});
</script></body></html>
